name: CI

on:
  push:
  pull_request:

jobs:
  local-checks:
    # These checks (py_compile, shell syntax, stdlib HTTP smoke test) are all
    # platform-independent. GitHub's macos-latest arm64 runners intermittently
    # drop loopback connections, which made the smoke test time out even though
    # the server starts fine locally and on Linux. Run on the reliable Linux
    # runner; the product itself remains macOS-first for real users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: python3 -m py_compile tools/sparring_center.py examples/demo_python_script.py

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Backend smoke test
        run: bash scripts/smoke-test.sh 8876
